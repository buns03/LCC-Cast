<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LCCast - Change Password</title>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/voter/password-handler.css" />
    <link rel="stylesheet" href="/css/modal.css" />
  </head>

  <body>
    <div class="login-page">
      <!-- =====================================================
           CHANGE PASSWORD CARD
      ====================================================== -->

      <main class="login-container">

        <!-- =================================================
             GREETING
        ================================================== -->

        <div class="change-password-header">
          <h2>Hello, <span th:text="${displayName}">Username</span></h2>

          <p class="password-subtext">Please change your password before proceeding.</p>
        </div>

        <!-- =================================================
             CHANGE PASSWORD FORM
        ================================================== -->

        <form
          id="changePasswordForm"
          th:action="@{/voter/change-password}"
          method="post"
          novalidate
        >

          <!-- New Password -->

          <div class="login-form-group">
            <label for="password"> Password </label>

            <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              placeholder="Enter your new password"
            />

            <span
              class="inline-error"
              id="passwordError"
            ></span>
          </div>

          <!-- Confirm Password -->

          <div class="login-form-group">
            <label for="confirmPassword"> Confirm Password </label>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              autocomplete="new-password"
              placeholder="Confirm your new password"
            />

            <span
              class="inline-error"
              id="confirmPasswordError"
            ></span>
          </div>

          <!-- Server Error -->

          <span
            class="inline-error server-error"
            id="changePasswordServerError"
            th:if="${passwordError}"
            th:text="${passwordError}"
          ></span>

          <!-- Save -->

          <button
            type="submit"
            class="login-button"
            id="savePasswordBtn"
          >
            Save Password
          </button>

        </form>

      </main>
    </div>

    <!-- =========================================================
         ACTION LOADING MODAL
    ========================================================== -->

    <div
      class="modal-overlay loading-modal-overlay"
      id="actionLoadingModal"
      aria-hidden="true"
    >
      <div
        class="action-loading-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="actionLoadingTitle"
      >
        <div class="action-loading-spinner">
          <span></span>
        </div>

        <div class="action-loading-content">
          <h2 id="actionLoadingTitle">Please Wait</h2>

          <p id="actionLoadingMessage">
            Saving your new password...
          </p>
        </div>
      </div>
    </div>

    <script src="/js/voter/password-handler.js"></script>
  </body>
</html>
